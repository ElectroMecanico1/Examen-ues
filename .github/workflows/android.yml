
name: Crear APK UES Lectura

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UES_Lectura_Android_Nativo

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: UES-Lectura-APK
          path: UES_Lectura_Android_Nativo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
